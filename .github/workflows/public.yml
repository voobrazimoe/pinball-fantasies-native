name: Asset-free source
on:
  push:
    paths-ignore:
      - 'hosts/android/**'
      - 'docs/android.md'
      - '.github/workflows/android-a0.yml'
      - '.github/workflows/android-host.yml'
      - 'tools/build_android_engine.sh'
      - 'tools/check_android_elf.py'
      - 'tools/test_check_android_elf.py'
      - 'tools/run_android_abi_smoke.sh'
      - 'tools/run_android_host_smoke.sh'
      - 'tools/test_android_import.sh'
      - 'tools/test_android_a3.sh'
      - 'tools/test_android_a4.sh'
      - 'tools/test_android_a5.sh'
  pull_request:
    paths-ignore:
      - 'hosts/android/**'
      - 'docs/android.md'
      - '.github/workflows/android-a0.yml'
      - '.github/workflows/android-host.yml'
      - 'tools/build_android_engine.sh'
      - 'tools/check_android_elf.py'
      - 'tools/test_check_android_elf.py'
      - 'tools/run_android_abi_smoke.sh'
      - 'tools/run_android_host_smoke.sh'
      - 'tools/test_android_import.sh'
      - 'tools/test_android_a3.sh'
      - 'tools/test_android_a4.sh'
      - 'tools/test_android_a5.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - if: runner.os == 'Linux'
        run: echo "CGO_CFLAGS=$(pkg-config --cflags sdl2)" >> "$GITHUB_ENV"
      - run: python tools/check_public_source.py
      - if: runner.os == 'macOS'
        name: Prove native Apple Silicon
        run: test "$(uname -m)" = arm64
      - if: runner.os != 'macOS'
        run: go test -p=1 -count=1 ./...
      - if: runner.os == 'macOS'
        name: Native shared engine tests (CLI host is Linux/Windows only)
        shell: bash
        run: |
          packages=$(go list ./... | sed '/\/internal\/platform$/d; /\/cmd\/pinballfantasies$/d')
          go test -p=1 -count=1 $packages
      - name: Synthetic runtime policy regressions
        run: go test -count=1 -v ./internal/settings ./internal/audio ./internal/datalayout ./internal/oracle

      - if: runner.os == 'Linux'
        name: Build native engine C interfaces (no commercial inputs)
        run: |
          mkdir -p bin
          go build -buildvcs=false -trimpath -buildmode=c-archive -o bin/libpfengine.a ./cmd/pfengine
          go build -buildvcs=false -trimpath -buildmode=c-shared -o bin/libpfengine.so ./cmd/pfengine

      - if: runner.os == 'macOS'
        name: Build native Apple Silicon C engine interfaces
        run: |
          mkdir -p bin
          go build -buildvcs=false -trimpath -buildmode=c-archive -o bin/libpfengine.a ./cmd/pfengine
          go build -buildvcs=false -trimpath -buildmode=c-shared -o bin/libpfengine.dylib ./cmd/pfengine
      - if: runner.os != 'macOS'
        run: go build -buildvcs=false -trimpath -o pinballfantasies${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/pinballfantasies
# No commercial fixtures, reference downloads, personal tags or artifact uploads.
