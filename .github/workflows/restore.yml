name: Restore tags and releases
on:
  push:
    branches: ['claude/project-thread-epldm8']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Recreate tags and releases
        run: |
          fail() { echo "::error::$1: $(tr '\n' ' ' < /tmp/out | tail -c 700)"; exit 1; }
          while read tag sha; do
            gh release view "$tag" >/tmp/out 2>&1 && continue
            if [ "$tag" = v0.1.1 ]; then title="Pinball Fantasies Native $tag"; else title="Pinball Fantasies $tag"; fi
            files=$(find "restore/$tag" -type f ! -name RELEASE-NOTES.md | sort)
            gh release create "$tag" --target "$sha" --prerelease --latest=false --title "$title" --notes-file "restore/$tag/RELEASE-NOTES.md" $files >/tmp/out 2>&1 || fail "release $tag"
          done < restore/TAGS
          gh release edit v0.1.7 --latest >/tmp/out 2>&1 || fail "latest"
      - name: Delete this branch
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/heads/${GITHUB_REF_NAME}"
