name: Desktop release candidate artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-candidate.yml]
permissions:
  contents: read
jobs:
  windows-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config
      - name: Configure public toolchain
        run: |
          mkdir -p .tools
          ln -s "$(go env GOROOT)" .tools/go
          echo "CGO_CFLAGS=$(pkg-config --cflags sdl2)" >> "$GITHUB_ENV"
      - name: Asset-free tests and source hygiene
        run: |
          python3 tools/check_public_source.py
          ./tools/go.sh test -p=1 -count=1 ./...
      - name: Build fresh public Windows and Linux artifacts
        run: ./tools/build_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PinballFantasies-windows-linux-public
          path: |
            release/windows/pinballfantasies.exe
            release/linux/PinballFantasies-x86_64.AppImage
          if-no-files-found: error
