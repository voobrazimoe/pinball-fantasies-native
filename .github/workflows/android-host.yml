name: Android host
on:
  push:
    branches: [android-host]
    paths:
      - '.github/workflows/android-host.yml'
      - 'hosts/android/**'
      - 'tools/check_android_elf.py'
      - 'tools/test_check_android_elf.py'
      - 'tools/run_android_host_smoke.sh'
      - 'tools/test_android_import.sh'
      - 'tools/build_personal_android.py'
      - 'tools/test_build_personal_android.py'
      - 'tools/personal_assets.py'
      - 'tools/test_android_a3.sh'
      - 'tools/test_android_a4.sh'
      - 'tools/test_android_a5.sh'
      - 'tools/build_android_engine.sh'
      - 'tools/build_engine.sh'
      - 'cmd/pfengine/**'
      - 'internal/**'
      - 'docs/android.md'
  pull_request:
    paths:
      - '.github/workflows/android-host.yml'
      - 'hosts/android/**'
      - 'tools/check_android_elf.py'
      - 'tools/test_check_android_elf.py'
      - 'tools/run_android_host_smoke.sh'
      - 'tools/test_android_import.sh'
      - 'tools/build_personal_android.py'
      - 'tools/test_build_personal_android.py'
      - 'tools/personal_assets.py'
      - 'tools/test_android_a3.sh'
      - 'tools/test_android_a4.sh'
      - 'tools/test_android_a5.sh'
      - 'tools/build_android_engine.sh'
      - 'tools/build_engine.sh'
      - 'cmd/pfengine/**'
      - 'internal/**'
      - 'docs/android.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_16K_IMAGE: 'system-images;android-35;google_apis_ps16k;x86_64'
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

jobs:
  a5-engine-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test ELF alignment gate
        run: python3 tools/test_check_android_elf.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            "ndk;${ANDROID_NDK_VERSION}" \
            platform-tools \
            emulator \
            "${ANDROID_16K_IMAGE}"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

      - name: Asset-free personal builder safety tests
        run: python3 tools/test_build_personal_android.py
      - name: Asset-free import transaction tests
        run: sh tools/test_android_import.sh
      - name: Asset-free A5 focus policy and native route coordination
        run: sh tools/test_android_a5.sh
      - name: A4 concurrent ring under ThreadSanitizer
        run: |
          # Keep the dedicated runner address space compatible with GCC TSAN.
          sudo sysctl -w vm.mmap_rnd_bits=28
          c++ -std=c++17 -pthread -fsanitize=thread -g -O1 -Ihosts/android/app/src/main/cpp hosts/android/tests/pcm_ring_test.cpp -o "${RUNNER_TEMP}/a4-ring-tsan"
          "${RUNNER_TEMP}/a4-ring-tsan"
      - name: A5 native coordination under ThreadSanitizer
        run: |
          PF_A3_TEST_FLAGS='-fsanitize=thread -g -O1' sh tools/test_android_a3.sh
          PF_A4_TEST_FLAGS='-fsanitize=thread -g -O1' sh tools/test_android_a4.sh
      - name: Shared presentation policy regressions
        run: go test -count=1 ./internal/physics ./internal/presentation ./internal/engine ./internal/frontend ./internal/source
      - name: Build ABI 1 engine for both public ABIs
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          sh tools/build_android_engine.sh all
      - name: Build A5 debug APK
        id: apk-build
        run: gradle -p hosts/android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify public APK and native alignment
        shell: bash
        run: |
          APK='hosts/android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          if unzip -Z1 "$APK" | grep -Eqi '(^|/)(INTRO\.PRG|INTRO\.MOD|MOD2\.MOD|TABLE[1-4]\.(PRG|MOD|HI)|PINBALL\.CFG)$|^assets/personal-data/'; then
            echo 'commercial DOS payload found in public Android APK' >&2
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          rm -rf "${RUNNER_TEMP}/a1-apk"
          mkdir -p "${RUNNER_TEMP}/a1-apk"
          unzip -q "$APK" 'lib/*/*.so' -d "${RUNNER_TEMP}/a1-apk"
          unzip -Z1 "$APK" | grep '^lib/'
          for abi in arm64-v8a x86_64; do
            test -f "${RUNNER_TEMP}/a1-apk/lib/$abi/libpfengine.so"
            test -f "${RUNNER_TEMP}/a1-apk/lib/$abi/libpinball_android.so"
          done
          OBJDUMP="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          while IFS= read -r library; do
            python3 tools/check_android_elf.py "$library" --objdump "$OBJDUMP"
            if [[ "$library" == */libpfengine.so ]]; then
              "$OBJDUMP" -T "$library" > "${RUNNER_TEMP}/engine-symbols.txt"
              for symbol in pf_engine_abi_version pf_engine_create pf_engine_destroy pf_engine_advance pf_engine_frame pf_engine_set_presentation pf_engine_suspend pf_engine_resume pf_engine_set_action pf_engine_key pf_engine_release pf_engine_plunger_delta pf_engine_plunger_target pf_engine_plunger_fire pf_engine_state; do
                grep -E "[[:space:]]\\.text[[:space:]].*[[:space:]]${symbol}$" "${RUNNER_TEMP}/engine-symbols.txt"
              done
            fi
            if [[ "$library" == */libpinball_android.so ]]; then
              "$OBJDUMP" -T "$library" > "${RUNNER_TEMP}/a1-symbols.txt"
              for symbol in android_main GameActivity_onCreate Java_com_google_androidgamesdk_GameActivity_initializeNativeCode; do
                grep -E "[[:space:]]\\.text[[:space:]].*[[:space:]]${symbol}$" "${RUNNER_TEMP}/a1-symbols.txt"
              done
            fi
          done < <(find "${RUNNER_TEMP}/a1-apk/lib" -type f -name '*.so' -print | sort)

      - name: Start 16 KB Android emulator
        # The API 35 ps16k image crashes in precompiled services.odex
        # AppIdSettingMap.getSetting during package installation/launch. Run
        # Java in the ART interpreter for this image; native EGL/JNI code and
        # the 16 KB page-size checks still execute normally. This is not a
        # performance/physical-device acceptance test.
        shell: bash
        run: |
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          set -x
          wait_android_services() {
            local deadline=$((SECONDS + 240)) settings_value activity_user package_path window_size
            until settings_value=$(timeout 10 adb shell settings get system screen_off_timeout 2>/dev/null | tr -d '\r') &&
                  [[ "$settings_value" =~ ^[0-9]+$ ]] &&
                  activity_user=$(timeout 10 adb shell cmd activity get-current-user 2>/dev/null | tr -d '\r') &&
                  [[ "$activity_user" =~ ^[0-9]+$ ]] &&
                  package_path=$(timeout 10 adb shell pm path android 2>/dev/null | tr -d '\r') &&
                  [[ "$package_path" == package:* ]] &&
                  window_size=$(timeout 10 adb shell wm size 2>/dev/null | tr -d '\r') &&
                  [[ "$window_size" == *'Physical size:'* ]]; do
              if (( SECONDS >= deadline )); then
                echo 'Android settings/activity/package/window services did not become responsive' >&2
                return 1
              fi
              sleep 2
            done
          }
          echo no | "$AVDMANAGER" create avd --force --name pf-a1 --package "${ANDROID_16K_IMAGE}" --device pixel_6
          test -f "${ANDROID_AVD_HOME}/pf-a1.ini"
          if [ -e /dev/kvm ]; then sudo chown "$USER" /dev/kvm; fi
          # Dummy host backend: guest callbacks run without audible host output.
          nohup env QEMU_AUDIO_DRV=none "${ANDROID_HOME}/emulator/emulator" \
            -avd pf-a1 -no-window -no-snapshot -no-boot-anim \
            -no-metrics -gpu swiftshader_indirect >"${RUNNER_TEMP}/a1-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          wait_android_services
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          # Emulator -prop accepts qemu.* only. Configure ART through the
          # userdebug guest, then restart zygote/system_server before installing.
          timeout 20 adb root
          timeout 60 adb wait-for-device
          # wait-for-device can return before the restarted root shell works.
          timeout 60 bash -c 'until [ "$(timeout 10 adb shell id -u 2>/dev/null | tr -d "\r")" = 0 ]; do sleep 2; done'
          wait_android_services
          timeout 20 adb shell stop
          timeout 10 adb shell setprop dalvik.vm.usejit false
          timeout 10 adb shell setprop dalvik.vm.extra-opts -Xint
          timeout 10 adb shell setprop sys.boot_completed 0
          timeout 20 adb shell start
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          # boot_completed does not guarantee Binder services can handle commands.
          wait_android_services
          # First-run immersive education owns focus. Write after the ART
          # restart: stopping system_server immediately after settings put can
          # race persistence. Require readback before assertions/install/smoke.
          timeout 10 adb shell settings put secure immersive_mode_confirmations confirmed
          timeout 60 bash -c 'until [ "$(timeout 10 adb shell settings get secure immersive_mode_confirmations 2>/dev/null | tr -d "\r")" = confirmed ]; do sleep 2; done'
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          test "$(adb shell getprop dalvik.vm.extra-opts | tr -d '\r')" = '-Xint'
          test "$(adb shell getprop dalvik.vm.usejit | tr -d '\r')" = 'false'
          test "$(adb shell settings get secure immersive_mode_confirmations | tr -d '\r')" = 'confirmed'

      - name: Exercise packaged ABI through A2 JNI (invented invalid data only)
        shell: bash
        run: |
          adb install -r hosts/android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r hosts/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 90 adb shell am instrument -w io.github.voobrazimoe.pinballfantasies.test/io.github.voobrazimoe.pinballfantasies.ImportInstrumentation | tee "${RUNNER_TEMP}/a2-instrumentation.txt"
          grep -q 'PASS: A5 foreground focus' "${RUNNER_TEMP}/a2-instrumentation.txt"
          grep -q 'PASS: A4 packaged Oboe' "${RUNNER_TEMP}/a2-instrumentation.txt"
          grep -q 'PASS: packaged ABI 1 JNI' "${RUNNER_TEMP}/a2-instrumentation.txt"
          if grep -q 'FAIL:' "${RUNNER_TEMP}/a2-instrumentation.txt"; then exit 1; fi
          adb shell am force-stop io.github.voobrazimoe.pinballfantasies

      - name: Exercise A1 rendering, rotation and lifecycle
        run: sh tools/run_android_host_smoke.sh

      - name: Upload A5 APK
        if: ${{ !cancelled() && steps.apk-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pinball-fantasies-android-a5-debug
          if-no-files-found: error
          path: hosts/android/app/build/outputs/apk/debug/app-debug.apk

      - if: always()
        name: Emulator diagnostics
        shell: bash
        run: |
          timeout 5 adb shell getprop ro.build.version.release || true
          timeout 5 adb shell getconf PAGE_SIZE || true
          timeout 5 adb logcat -d -s PinballFantasies:I AndroidRuntime:E GameActivity:V DEBUG:F '*:S' || true
          timeout 5 adb logcat -d | tail -300 || true
          tail -200 "${RUNNER_TEMP}/a1-emulator.log" || true
