name: Android host
on:
  push:
    branches: [android-host]
    paths:
      - '.github/workflows/android-host.yml'
      - 'hosts/android/**'
      - 'tools/check_android_elf.py'
      - 'tools/test_check_android_elf.py'
      - 'tools/run_android_host_smoke.sh'
  pull_request:
    paths:
      - '.github/workflows/android-host.yml'
      - 'hosts/android/**'
      - 'tools/check_android_elf.py'
      - 'tools/test_check_android_elf.py'
      - 'tools/run_android_host_smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_16K_IMAGE: 'system-images;android-35;google_apis_ps16k;x86_64'
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd

jobs:
  a1-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test ELF alignment gate
        run: python3 tools/test_check_android_elf.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            "ndk;${ANDROID_NDK_VERSION}" \
            platform-tools \
            emulator \
            "${ANDROID_16K_IMAGE}"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"

      - name: Build A1 debug APK
        id: apk-build
        run: gradle -p hosts/android :app:assembleDebug --stacktrace

      - name: Verify public APK and native alignment
        shell: bash
        run: |
          APK='hosts/android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          if unzip -Z1 "$APK" | grep -Eqi '(^|/)(INTRO\.PRG|INTRO\.MOD|MOD2\.MOD|TABLE[1-4]\.(PRG|MOD|HI)|PINBALL\.CFG)$'; then
            echo 'commercial DOS payload found in public Android APK' >&2
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          rm -rf "${RUNNER_TEMP}/a1-apk"
          mkdir -p "${RUNNER_TEMP}/a1-apk"
          unzip -q "$APK" 'lib/*/*.so' -d "${RUNNER_TEMP}/a1-apk"
          OBJDUMP="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          while IFS= read -r library; do
            python3 tools/check_android_elf.py "$library" --objdump "$OBJDUMP"
          done < <(find "${RUNNER_TEMP}/a1-apk/lib" -type f -name '*.so' -print | sort)

      - name: Start 16 KB Android emulator
        # The API 35 ps16k image crashes in precompiled services.odex
        # AppIdSettingMap.getSetting during package installation/launch. Run
        # Java in the ART interpreter for this image; native EGL/JNI code and
        # the 16 KB page-size checks still execute normally. This is not a
        # performance/physical-device acceptance test.
        shell: bash
        run: |
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd --force --name pf-a1 --package "${ANDROID_16K_IMAGE}" --device pixel_6
          test -f "${ANDROID_AVD_HOME}/pf-a1.ini"
          if [ -e /dev/kvm ]; then sudo chown "$USER" /dev/kvm; fi
          nohup "${ANDROID_HOME}/emulator/emulator" \
            -avd pf-a1 -no-window -no-audio -no-snapshot -no-boot-anim \
            -no-metrics -gpu swiftshader_indirect >"${RUNNER_TEMP}/a1-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          # Emulator -prop accepts qemu.* only. Configure ART through the
          # userdebug guest, then restart zygote/system_server before installing.
          timeout 20 adb root
          timeout 30 adb wait-for-device
          timeout 20 adb shell stop
          timeout 10 adb shell setprop dalvik.vm.usejit false
          timeout 10 adb shell setprop dalvik.vm.extra-opts -Xint
          timeout 10 adb shell setprop sys.boot_completed 0
          timeout 20 adb shell start
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'
          test "$(adb shell getprop dalvik.vm.extra-opts | tr -d '\r')" = '-Xint'
          test "$(adb shell getprop dalvik.vm.usejit | tr -d '\r')" = 'false'

      - name: Exercise A1 rendering, rotation and lifecycle
        run: sh tools/run_android_host_smoke.sh

      - name: Upload A1 APK
        if: ${{ !cancelled() && steps.apk-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pinball-fantasies-android-a1-debug
          if-no-files-found: error
          path: hosts/android/app/build/outputs/apk/debug/app-debug.apk

      - if: always()
        name: Emulator diagnostics
        shell: bash
        run: |
          timeout 5 adb shell getprop ro.build.version.release || true
          timeout 5 adb shell getconf PAGE_SIZE || true
          timeout 5 adb logcat -d -s PinballFantasies:I AndroidRuntime:E GameActivity:V DEBUG:F '*:S' || true
          timeout 5 adb logcat -d | tail -300 || true
          tail -200 "${RUNNER_TEMP}/a1-emulator.log" || true
