plugins {
    id 'com.android.application'
}

// Only the local personal builder supplies these paired absolute paths. All
// merged assets/APKs are isolated so its finally cleanup removes private bytes.
def personalAssets = providers.gradleProperty('personalAssetsDir').orNull
def personalOutput = providers.gradleProperty('personalBuildDir').orNull
if ((personalAssets == null) != (personalOutput == null)) {
    throw new GradleException('Personal assets require an isolated personalBuildDir')
}
if (personalAssets != null) {
    if (!new File(personalAssets).isAbsolute() || !new File(personalOutput).isAbsolute()) {
        throw new GradleException('Personal paths must be absolute')
    }
    layout.buildDirectory.set(file(personalOutput))
}

android {
    namespace 'io.github.voobrazimoe.pinballfantasies'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.voobrazimoe.pinballfantasies'
        minSdk 27
        targetSdk 36
        manifestPlaceholders = [appLabel: personalAssets != null ? 'Pinball Fantasies (Personal)' : '@string/app_name']
        testInstrumentationRunner 'io.github.voobrazimoe.pinballfantasies.ImportInstrumentation'
        versionCode 4
        versionName '0.1.4'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // CMake links the generated library; explicitly package both ABI outputs.
    sourceSets {
        main.jniLibs.srcDirs = ['../../../bin/android']
        // Public APKs carry the official 10-minute demo as assets/demo/*.
        main.assets.srcDirs = personalAssets != null ? [personalAssets] : ['../../../internal/demodata/assets']
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.oboe:oboe:1.10.0'
    implementation 'androidx.games:games-activity:4.4.2'
}
